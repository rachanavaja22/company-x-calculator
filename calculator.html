<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Calculator</title>
<style>
  :root {
    --bg: #f2f3f5;
    --panel: #ffffff;
    --text: #1d1f23;
    --muted: #6b7079;
    --key: #eceef1;
    --key-hover: #e0e3e8;
    --op: #2563eb;
    --op-hover: #1d4ed8;
    --focus: #2563eb;
    --op-text: #ffffff;
    --fn: #d9dce2;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --panel: #1c1e22;
      --text: #f1f2f4;
      --muted: #9097a2;
      --key: #2a2d33;
      --key-hover: #353941;
      --op: #2563eb;
      --op-hover: #1d4ed8;
      --focus: #8ab4ff;
      --op-text: #ffffff;
      --fn: #3a3e46;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .calc {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .display {
    text-align: right;
    padding: 8px 4px 16px;
    min-height: 96px;
    overflow: hidden;
  }
  .expr {
    font-size: 15px;
    color: var(--muted);
    min-height: 20px;
    white-space: nowrap;
    overflow: hidden;
  }
  .value {
    font-size: 44px;
    font-weight: 300;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 22px;
    height: 60px;
    border: none;
    border-radius: 14px;
    background: var(--key);
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
  }
  button:hover { background: var(--key-hover); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .fn { background: var(--fn); font-size: 18px; }
  .op { background: var(--op); color: var(--op-text); }
  .op:hover { background: var(--op-hover); }
  .op.active { outline: 2px solid var(--text); outline-offset: -4px; }
  .zero { grid-column: span 2; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>
    <div class="sr-only" id="sr" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="keys">
      <button class="fn" data-action="clear" aria-label="AC, all clear">AC</button>
      <button class="fn" data-action="sign" aria-label="Change sign">±</button>
      <button class="fn" data-action="back" aria-label="Backspace">⌫</button>
      <button class="op" data-op="/" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="*" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="-" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-op="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="dot" aria-label="Decimal point">.</button>
      <button class="op" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

<script>
  const SYMBOLS = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  const WORDS = { "+": "plus", "-": "minus", "*": "times", "/": "divided by" };
  const valueEl = document.getElementById("value");
  const exprEl = document.getElementById("expr");
  const srEl = document.getElementById("sr");

  let current = "0";      // number being typed, or the last result (string)
  let typing = false;     // the user has started typing the current number
  let stored = null;      // running value of the chain before the current number
  let operator = null;    // pending operator
  let chain = "";         // expression text before the pending operator, e.g. "7 + 2"
  let announcement = "";  // text for the screen-reader status region

  function compute(a, b, op) {
    switch (op) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/": return b === 0 ? NaN : a / b;
    }
  }

  // Short enough to fit the 44px display; screen readers get the full wording
  const DIV_ZERO = "Can't ÷ by 0";
  const TOO_LARGE = "Too large";
  const SPOKEN_ERRORS = { [DIV_ZERO]: "Cannot divide by zero", [TOO_LARGE]: "Number too large" };
  const isError = s => s in SPOKEN_ERRORS;
  // Spell out the sign so "-12" is read as "minus 12" rather than "dash 12"
  const spokenValue = s => s.startsWith("-") ? `minus ${s.slice(1)}` : s;
  // Typographic minus for negative numbers in the expression line
  const shown = s => s.replace(/^-/, "−");

  function format(n) {
    if (Number.isNaN(n)) return DIV_ZERO;   // compute() returns NaN only for ÷ 0
    if (!isFinite(n)) return TOO_LARGE;
    // Trim floating-point noise like 0.1 + 0.2 = 0.30000000000000004
    const r = parseFloat(n.toPrecision(12));
    return Math.abs(r) >= 1e12 ? r.toExponential(6) : String(r);
  }

  function render() {
    valueEl.textContent = current;
    if (announcement) { srEl.textContent = announcement; announcement = ""; }
    const entry = typing ? shown(current) : "";
    exprEl.textContent = [operator !== null ? `${chain} ${SYMBOLS[operator]}` : "", entry].filter(Boolean).join(" ");
    exprEl.scrollLeft = exprEl.scrollWidth;   // keep the latest input in view
    document.querySelectorAll("[data-op]").forEach(b => {
      const pending = b.dataset.op === operator && !typing;
      b.classList.toggle("active", pending);
      b.setAttribute("aria-pressed", String(pending));
    });
  }

  function inputDigit(d) {
    if (isError(current)) clear();
    if (!typing) { current = d; typing = true; }
    else current = current === "0" ? d : current + d;
    if (current.replace(/[-.]/g, "").length > 15) current = current.slice(0, -1);
  }

  function inputDot() {
    if (isError(current)) clear();
    if (!typing) { current = "0."; typing = true; return; }
    if (!current.includes(".")) current += ".";
  }

  function setOperator(op) {
    if (isError(current)) return;
    if (operator === null) {            // start a chain from the current number (or last result)
      chain = shown(current);
      stored = parseFloat(current);
    } else if (typing) {                // fold the number just typed into the chain
      const result = compute(stored, parseFloat(current), operator);
      if (!isFinite(result)) {
        current = format(result); stored = null; operator = null; typing = false; chain = "";
        announcement = SPOKEN_ERRORS[current];
        return;
      }
      chain += ` ${SYMBOLS[operator]} ${shown(current)}`;
      stored = result;
    }                                   // otherwise just swap the pending operator
    operator = op;
    typing = false;
    announcement = `${format(stored)} ${WORDS[op]}`;
  }

  function equals() {
    if (operator === null || isError(current)) return;
    const result = compute(stored, parseFloat(current), operator);
    const spoken = `${format(stored)} ${WORDS[operator]} ${current}`;
    current = format(result);
    announcement = isError(current) ? SPOKEN_ERRORS[current] : `${spoken} equals ${current}`;
    stored = null;
    operator = null;
    typing = false;
    chain = "";
  }

  function clear() {
    current = "0"; typing = false; stored = null; operator = null; chain = "";
    announcement = "Cleared";
  }

  function backspace() {
    if (!typing || isError(current)) return;
    current = current.length > 1 && current !== "-0" ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
    announcement = spokenValue(current);
  }

  function toggleSign() {
    if (isError(current) || current === "0") return;
    current = current.startsWith("-") ? current.slice(1) : "-" + current;
    announcement = spokenValue(current);
  }

  document.querySelector(".keys").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.digit) inputDigit(b.dataset.digit);
    else if (b.dataset.op) setOperator(b.dataset.op);
    else ({ clear, sign: toggleSign, back: backspace, dot: inputDot, equals })[b.dataset.action]();
    render();
  });

  document.addEventListener("keydown", e => {
    const k = e.key;
    // Let Enter/Space activate the focused key instead of running "="
    if ((k === "Enter" || k === " ") && e.target.closest("button")) return;
    if (/^[0-9]$/.test(k)) inputDigit(k);
    else if (k === ".") inputDot();
    else if (k in SYMBOLS) setOperator(k);
    else if (k === "Enter" || k === "=") equals();
    else if (k === "Backspace") backspace();
    else if (k === "Escape") clear();
    else return;
    // Handled keys belong to the calculator (e.g. stops "/" opening Firefox Quick Find)
    e.preventDefault();
    render();
  });

  render();
</script>
</body>
</html>
