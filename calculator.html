<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Calculator</title>
<style>
  :root {
    --bg: #f2f3f5;
    --panel: #ffffff;
    --text: #1d1f23;
    --muted: #6b7079;
    --key: #eceef1;
    --key-hover: #e0e3e8;
    --op: #2563eb;
    --op-text: #ffffff;
    --fn: #d9dce2;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --panel: #1c1e22;
      --text: #f1f2f4;
      --muted: #9097a2;
      --key: #2a2d33;
      --key-hover: #353941;
      --op: #2563eb;
      --op-text: #ffffff;
      --fn: #3a3e46;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .calc {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .display {
    text-align: right;
    padding: 8px 4px 16px;
    min-height: 96px;
    overflow: hidden;
  }
  .expr {
    font-size: 15px;
    color: var(--muted);
    min-height: 20px;
    white-space: nowrap;
  }
  .value {
    font-size: 44px;
    font-weight: 300;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 22px;
    height: 60px;
    border: none;
    border-radius: 14px;
    background: var(--key);
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
  }
  button:hover { background: var(--key-hover); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--op); outline-offset: 2px; }
  .fn { background: var(--fn); font-size: 18px; }
  .op { background: var(--op); color: var(--op-text); }
  .op:hover { filter: brightness(1.1); background: var(--op); }
  .op.active { outline: 2px solid var(--text); outline-offset: -4px; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="value" id="value" aria-live="polite">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="sign">±</button>
      <button class="fn" data-action="back" aria-label="Backspace">⌫</button>
      <button class="op" data-op="/" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="*" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="-" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-op="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="dot">.</button>
      <button class="op" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

<script>
  const SYMBOLS = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  const valueEl = document.getElementById("value");
  const exprEl = document.getElementById("expr");

  let current = "0";      // number being typed (string)
  let stored = null;      // left operand (number)
  let operator = null;    // pending operator
  let fresh = false;      // next digit starts a new number

  function compute(a, b, op) {
    switch (op) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/": return b === 0 ? NaN : a / b;
    }
  }

  function format(n) {
    if (!isFinite(n)) return "Error";
    // Trim floating-point noise like 0.1 + 0.2 = 0.30000000000000004
    const r = parseFloat(n.toPrecision(12));
    return Math.abs(r) >= 1e12 ? r.toExponential(6) : String(r);
  }

  function render() {
    valueEl.textContent = current;
    exprEl.textContent = operator !== null ? `${format(stored)} ${SYMBOLS[operator]}` : "";
    document.querySelectorAll("[data-op]").forEach(b =>
      b.classList.toggle("active", b.dataset.op === operator && fresh));
  }

  function inputDigit(d) {
    if (current === "Error") clear();
    if (fresh) { current = d; fresh = false; }
    else current = current === "0" ? d : current + d;
    if (current.replace(/[-.]/g, "").length > 15) current = current.slice(0, -1);
  }

  function inputDot() {
    if (current === "Error") clear();
    if (fresh) { current = "0."; fresh = false; return; }
    if (!current.includes(".")) current += ".";
  }

  function setOperator(op) {
    if (current === "Error") return;
    const n = parseFloat(current);
    if (operator !== null && !fresh) {
      const result = compute(stored, n, operator);
      current = format(result);
      if (current === "Error") { stored = null; operator = null; fresh = true; return; }
      stored = parseFloat(current);
    } else if (operator === null || !fresh) {
      stored = n;
    }
    operator = op;
    fresh = true;
  }

  function equals() {
    if (operator === null || current === "Error") return;
    const result = compute(stored, parseFloat(current), operator);
    exprEl.textContent = "";
    current = format(result);
    stored = null;
    operator = null;
    fresh = true;
  }

  function clear() {
    current = "0"; stored = null; operator = null; fresh = false;
  }

  function backspace() {
    if (fresh || current === "Error") return;
    current = current.length > 1 && current !== "-0" ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
  }

  function toggleSign() {
    if (current === "Error" || current === "0") return;
    current = current.startsWith("-") ? current.slice(1) : "-" + current;
  }

  document.querySelector(".keys").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.digit) inputDigit(b.dataset.digit);
    else if (b.dataset.op) setOperator(b.dataset.op);
    else ({ clear, sign: toggleSign, back: backspace, dot: inputDot, equals })[b.dataset.action]();
    render();
  });

  document.addEventListener("keydown", e => {
    const k = e.key;
    // Let Enter/Space activate the focused key instead of running "="
    if ((k === "Enter" || k === " ") && e.target.closest("button")) return;
    if (/^[0-9]$/.test(k)) inputDigit(k);
    else if (k === ".") inputDot();
    else if (k in SYMBOLS) setOperator(k);
    else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
    else if (k === "Backspace") backspace();
    else if (k === "Escape") clear();
    else return;
    render();
  });

  render();
</script>
</body>
</html>
